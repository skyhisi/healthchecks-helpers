name: Build
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get install -yqqU just
      - name: Build Debian
        run: just docker-build-deb
      - name: Build Fedora
        run: just docker-build-rpm
      - uses: actions/upload-artifact@v7
        with:
          path: |
            dist/*.deb
            dist/*.rpm
